name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Explicit bash adds -o pipefail, so a crash before `| tee` still fails the step.
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  demo:
    # The offline demo is the README example: it must keep paying the honest endpoints, stopping
    # the price spike and the payee swap, and asking before the $0.30 report (no one answers, so
    # it is declined). Mock payments only, so no secrets.
    name: offline demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the mock demo
        run: node demo/agent.js | tee demo.log
      - name: Check the guard stopped both bad payments and asked about the large one
        run: |
          grep -q "is 40x the usual" demo.log
          grep -q "rnaps.paywall.testnet, which is not one of its known addresses" demo.log
          # The ask line itself, followed by the decline it led to: the /quotes denial also says
          # "needs your approval", so that phrase alone would pass even if nobody was asked.
          grep -A1 -F '? asks you: $0.30 is above the $0.25 that needs your approval' demo.log | grep -q '^✗ declined /report'
          grep -q "3 payments stopped" demo.log
      - name: Check the package contents
        run: npm pack --dry-run
