[package]
name = "spend-guard-near"
version = "0.1.0"
description = "Spend Guard's on-chain spending guard for NEAR: a payee allowlist, a per-payment cap and a daily cap, enforced by the contract"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/vulinh1704/spend-guard"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
